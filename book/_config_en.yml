title: |
  Guide to conducting
  a systematic
  literature review (SLR)
author: Daniel H. de la Iglesia
copyright: "2026"
logo: "_static/logo.png"
language: en
exclude_patterns: ["_static/downloads/**", "_build", "Thumbs.db", ".DS_Store", "**.ipynb_checkpoints", "_build_*", "temp_build_*", "latex_templates*", "_TRASH*"]
execute:
  execute_notebooks: off
parse:
  myst_enable_extensions:
    - colon_fence
    - dollarmath
    - linkify
    - tasklist
  use_download_button: true
  extra_navbar: |
    <div style="margin-top: 10px; font-size: 0.8em; color: #666;">
      Powered by <a href="https://jupyterbook.org">Jupyter Book</a>
    </div>
html_theme_options:
  icon_links: []
sphinx:
  extra_extensions:
    - sphinx_thebe
    - sphinxcontrib.bibtex
    - sphinx_kroki
  config:
    language: en
    numfig: true
    html_show_copyright: false
    suppress_warnings:
    - bibtex.duplicate_citation
    html_js_files:
    - custom.js
    bibtex_bibfiles:
    - _static/references.bib
    thebe_config:
      always_load: false
      repository_url: https://github.com/binder-examples/jupyter-stacks-datascience
      repository_branch: master
      selector: ".thebe,.cell"
      selector_input: "pre"
      selector_output: ".output, .cell_output"
html:
  favicon: "_static/favicon.ico"
  extra_footer: |
    <p>Built with a modified version of <a href="https://teachbooks.io/">TeachBooks</a> from the <a href="https://github.com/elloza/teachbook_usal_template">TeachBook USAL template</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="license noopener noreferrer">CC BY 4.0<img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt=""><img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt=""></a></p>
latex_docclass:
  book: jupyterBook
latex:
  latex_engine: xelatex
  options: "english"
  subtitle: "Planning, searching, selection, synthesis, publication and responsible use of AI"
  header_title: |
    Guide to conducting a systematic
    literature review
  institution: "University of Salamanca"
  edition: "1st Edition"
  cover_logo: "_static/usal_logo.png"
  preamble: |
    \usepackage[english]{babel}
    \selectlanguage{english}
